[project]
name = "osmu-thestitch-flet"
version = "0.1.0"
description = "더스티치 OSMU 워크벤치 — Flet 데스크톱 버전 (Streamlit 버전과 병행 개발 중)"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0.0",
    "python-dotenv>=1.0",
    "cryptography>=43.0",
    "openai>=1.40",
    "anthropic>=0.34",
    "google-genai>=1.0",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "playwright>=1.46",
    "pyperclip>=1.9",
    "Pillow>=10.0",
    "pywin32; platform_system == 'Windows'",
]

[tool.flet]
product = "OSMU TheStitch 워크벤치"
org = "thestitch"
company = "thestitch"
